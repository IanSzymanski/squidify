<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090a10">
  <meta name="description" content="Your music, on your device. An offline music player with local folders, playlists, and balanced shuffle.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Squidify">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=10">
  <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png?v=10">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32-v9.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192-v9.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Squidify — Your music</title>
</head>
<body>
  <a class="skip-link" href="#main">Skip to library</a>
  <div class="app">
    <aside class="sidebar" aria-label="Sidebar">
      <a class="brand" href="#library" aria-label="Squidify library"><span class="brand-mark" data-mark></span>Squidify</a>
      <nav class="desktop-nav" aria-label="Main navigation">
        <button class="nav-link active" data-view="library"><span data-icon="library"></span>Your library</button>
        <button class="nav-link" data-view="liked"><span data-icon="heart"></span>Liked songs<span id="likedCount" class="nav-count">0</span></button>
      </nav>
      <div class="sidebar-label"><button data-view="playlists">PLAYLISTS</button><button class="icon-button" data-action="new-playlist" aria-label="Create playlist" title="Create playlist"><span data-icon="plus"></span></button></div>
      <div id="sidebarPlaylists" class="sidebar-playlists"></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <a class="mobile-brand" href="#library" aria-label="Squidify library"><span data-mark></span>Squidify</a>
        <div class="search-reveal"><label class="search-box"><span data-icon="search"></span><input id="searchInput" type="search" placeholder="Search your music" aria-label="Search your music" autocomplete="off"><kbd>/</kbd></label></div>
        <div class="top-actions"><button id="offlineBadge" class="offline-badge" data-view="settings"><span data-icon="download"></span><span>Preparing offline…</span></button><button class="icon-button settings-button" data-view="settings" aria-label="Settings and offline setup" title="Settings and offline setup"><span data-icon="settings"></span></button></div>
      </header>
      <main id="main" tabindex="-1" aria-label="Music library"><div class="initial-loading">Opening your library…</div></main>
    </div>
    <aside id="queuePanel" class="queue-panel" aria-label="Playback queue" hidden></aside>
  </div>
  <footer id="player" class="player" aria-label="Music player">
    <div class="now-track"><button id="nowArtwork" class="artwork tiny-art" data-action="now-playing" aria-label="Open now playing"><span data-icon="music"></span></button><button class="track-summary" data-action="now-playing"><strong id="nowTitle">Nothing playing yet</strong><span id="nowArtist">Choose something from your library</span></button><button id="playerLike" class="icon-button like-button" data-action="like-current" aria-label="Like current song" disabled><span data-icon="heart"></span></button></div>
    <div class="playback"><div class="playback-buttons"><button class="icon-button shuffle-control" data-action="shuffle" aria-label="Enable balanced shuffle" aria-pressed="false" title="Balanced shuffle"><span data-icon="shuffle"></span></button><button class="icon-button" data-action="previous" aria-label="Previous song" title="Previous song"><span data-icon="previous"></span></button><canvas class="audio-wave mini-wave" width="44" height="44" aria-label="Audio equalizer"></canvas><button class="play-toggle main-play" data-action="toggle-play" aria-label="Play" title="Play / pause"><span data-icon="play"></span></button><button class="icon-button output-control" data-action="audio-output" aria-label="Choose audio output" title="Audio output"><span data-icon="bluetooth"></span></button><button class="icon-button repeat-control" data-action="repeat" aria-label="Repeat off" title="Repeat off"><span data-icon="repeat"></span><b hidden>1</b></button></div><div class="scrubber"><span class="time elapsed">0:00</span><input type="range" class="seek" data-seek min="0" max="100" value="0" step="0.1" aria-label="Playback position" disabled><span class="time duration">0:00</span></div></div>
    <div class="player-extra"><button class="icon-button" data-action="queue" aria-label="Show queue" title="Queue"><span data-icon="queue"></span></button><button class="icon-button" id="muteButton" data-action="mute" aria-label="Mute" title="Mute"><span data-icon="volume"></span></button><input id="volumeInput" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume"><button class="icon-button expand-player" data-action="now-playing" aria-label="Expand now playing" title="Now playing"><span data-icon="up"></span></button></div>
  </footer>
  <nav class="mobile-nav" aria-label="Main navigation"><button data-view="library" class="active"><span data-icon="library"></span><span>Library</span></button><button data-view="liked"><span data-icon="heart"></span><span>Liked</span></button><button data-view="playlists"><span data-icon="list"></span><span>Playlists</span></button><button data-action="add-music"><span data-icon="plus"></span><span>Add music</span></button></nav>
  <dialog id="modal" class="modal" aria-labelledby="modalTitle"></dialog>
  <dialog id="nowDialog" class="now-dialog" aria-labelledby="fullTitle"></dialog>
  <div id="toast" popover="manual" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="importBanner" class="import-banner" role="status" hidden><span id="importText"></span><progress id="importProgress" max="1" value="0"></progress><button data-action="cancel-import">Stop after this song</button></div>
  <div id="fileInputs" hidden>
    <input id="fileInput" class="native-file-input" type="file" accept="audio/*,.mp3,.m4a,.aac,.flac,.wav,.ogg,.oga,.opus,.aiff,.aif,.mp4,.webm" aria-label="Choose audio files" multiple>
    <input id="folderInput" class="native-file-input" type="file" aria-label="Choose a music folder" webkitdirectory multiple>
  </div>
  <audio id="audio" preload="metadata" playsinline></audio>
  <noscript><div class="noscript">Squidify needs JavaScript to browse and play local music.</div></noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
